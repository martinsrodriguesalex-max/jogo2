<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Memory Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0a0a16;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 380px;
            background: #111126;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 210, 255, 0.2);
            border: 2px solid #1f1f45;
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 24px;
            color: #00d2ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #00ffaa;
            font-weight: bold;
        }
        /* Grade das Cartas */
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            perspective: 1000px; /* Efeito 3D para virar */
        }
        .card {
            width: 70px;
            height: 70px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s;
            cursor: pointer;
        }
        /* Classe aplicada via JS quando a carta é clicada */
        .card.flipped {
            transform: rotateY(180deg);
        }
        /* Faces da Carta */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }
        /* Verso da carta (fechada) */
        .card-back {
            background: linear-gradient(135deg, #1f1f45, #0a0a16);
            border: 2px solid #00d2ff;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.3);
        }
        .card-back::after {
            content: "?";
            color: #00d2ff;
            font-weight: bold;
        }
        /* Frente da carta (aberta) */
        .card-front {
            background: #1a1a3a;
            transform: rotateY(180deg);
            border: 2px solid #00ffaa;
        }
        /* Botão de reiniciar */
        #reset-btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #0052d4, #4364f7);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            text-transform: uppercase;
        }
        #reset-btn:hover {
            filter: brightness(1.2);
        }
        /* Tela de Vitória */
        #victory-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 22, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #victory-screen h2 {
            color: #00ffaa;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Cyber Memory</h1>
        <div id="hud">
            <div id="moves-txt">MOVIMENTOS: 0</div>
            <div id="pairs-txt">PARES: 0/8</div>
        </div>

        <!-- Grade onde as cartas serão injetadas -->
        <div id="grid"></div>

        <button id="reset-btn">Reiniciar Jogo</button>

        <!-- Tela de vitória oculta -->
        <div id="victory-screen" style="display: none;">
            <h2>VITÓRIA!</h2>
            <p style="color: #8fa0ba; margin-bottom: 20px;">Você limpou a matriz cibernética.</p>
            <button id="play-again-btn" style="padding: 12px 30px; border-radius: 25px; border: none; background: #00ffaa; color: #000; font-weight: bold; cursor: pointer;">JOGAR DE NOVO</button>
        </div>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const movesTxt = document.getElementById('moves-txt');
        const pairsTxt = document.getElementById('pairs-txt');
        const resetBtn = document.getElementById('reset-btn');
        const victoryScreen = document.getElementById('victory-screen');
        const playAgainBtn = document.getElementById('play-again-btn');

        // Lista de ícones vibrantes (Emojis estáveis que funcionam em qualquer sistema)
        const icons = ['🚀', '🛸', '👾', '🤖', '🌌', '🔮', '💎', '🔋'];
        // Duplica a lista para criar os pares correspondentes
        let deck = [...icons, ...icons];
        
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false; // Impede clicar em outras cartas durante a checagem

        // Embaralhamento rápido usando o algoritmo Fisher-Yates
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Cria a estrutura visual de blocos HTML para cada carta
        function createDeck() {
            gridEl.innerHTML = '';
            shuffle(deck);

            deck.forEach((icon, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = icon;
                card.dataset.id = index;

                const front = document.createElement('div');
                front.className = 'card-front';
                front.innerText = icon;

                const back = document.createElement('div');
                back.className = 'card-back';

                card.appendChild(front);
                card.appendChild(back);
                
                // Evento básico de clique 100% suportado por qualquer painel de VS Code
                card.addEventListener('click', () => flipCard(card));
                
                gridEl.appendChild(card);
            });
        }

        function flipCard(card) {
            // Evita cliques inválidos: na mesma carta, com o tabuleiro travado ou em cartas já pareadas
            if (lockBoard) return;
            if (card.classList.contains('flipped')) return;
            if (flippedCards.length >= 2) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesTxt.innerText = `MOVIMENTOS: ${moves}`;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.icon === card2.dataset.icon;

            if (isMatch) {
                // Deixa as cartas abertas e limpa a lista de controle
                flippedCards = [];
                matchedPairs++;
                pairsTxt.innerText = `PARES: ${matchedPairs}/8`;

                if (matchedPairs === 8) {
                    setTimeout(() => {
                        victoryScreen.style.display = 'flex';
                    }, 500);
                }
            } else {
                // Trava o clique, espera 1 segundo e desvira as cartas incorretas
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        function resetGame() {
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            lockBoard = false;
            movesTxt.innerText = `MOVIMENTOS: ${moves}`;
            pairsTxt.innerText = `PARES: ${matchedPairs}/8`;
            victoryScreen.style.display = 'none';
            createDeck();
        }

        // Atribuição direta dos botões de controle
        resetBtn.onclick = resetGame;
        playAgainBtn.onclick = resetGame;

        // Inicia o jogo automaticamente na primeira execução
        createDeck();
    </script>
</body>
</html>
